; ============================================================================
; Projeto: Sistema de Diagnóstico Veicular OBD-II baseado em Regras
; Instituição: UNIFEI / PET-TEC / UNIGOU 2026
; Autor: Gabriel Davi Silva Resende
; Orientador: [preencher]
; 
; Esta milestone (M0/Etapa 0) configura apenas o toolchain. As bibliotecas
; listadas em lib_deps são antecipadas para as milestones M1 (display) e
; M3 (OBD parser). O PlatformIO só as baixará quando forem #incluídas.
; ============================================================================

[platformio]
; Ambiente padrão usado quando rodamos "pio run" sem --environment
default_envs = esp32dev

[env:esp32dev]
; Plataforma alvo: ESP32 (Espressif32). Travar major version ^6.5 para
; reprodutibilidade — evita surpresas se a Espressif liberar breaking change.
platform = espressif32@^6.5.0

; Placa: ESP32 Dev Module (genérica 30 pinos com CH340C). É o mapeamento
; de pinos mais próximo do seu hardware; o CH340C é transparente para o
; firmware (é apenas o bridge USB-UART).
board = esp32dev

; Framework: Arduino (em vez de ESP-IDF puro). Justificativa: comunidade
; maior, bibliotecas SSD1306 e BluetoothSerial maduras, curva de aprendizado
; mais suave. Trade-off: menos controle fino que ESP-IDF, mas suficiente
; para esta fase. Reavaliar na fase ML se precisarmos de ESP-IDF.
framework = arduino

; Velocidade do monitor serial. 115200 é o padrão do core Arduino-ESP32
; e é compatível com o CH340C. Usar 921600 pode causar perda de caracteres
; em logs densos — preferimos confiabilidade.
monitor_speed = 115200

; Filtros do monitor serial:
; - esp32_exception_decoder: traduz stack traces de panic em nomes de função
; - colorize: colore saídas por nível (ERROR/WARN/INFO)
; - time: adiciona timestamp no início de cada linha (essencial para medir latência)
monitor_filters = esp32_exception_decoder, colorize, time

; Velocidade de upload do firmware via USB. 921600 é rápido e estável
; para o CH340C. Se houver erros de "failed to connect", baixar para 460800.
upload_speed = 921600

; Esquema de partições padrão (4 MB flash: 1.25 MB app + 1.5 MB SPIFFS + 
; 1.25 MB outro). Suficiente para esta fase. Se o firmware crescer > 1.2 MB
; (com ML futuro), migrar para partitions_no_ota.csv.
board_build.partitions = default.csv

; Flags de compilação:
; - -O2: otimização equilibrada (não tão agressiva quanto -Os em tamanho,
;   mas rápida o suficiente para latência < 250 ms).
; - -std=gnu++17: C++17 (permite std::optional, structured bindings, etc.).
; - -Wall -Wextra: warnings verbosos — FORÇA disciplina de código.
; - -DCORE_DEBUG_LEVEL=3: habilita logs de nível WARN+ do core ESP32.
; - -DPROJECT_VERSION=\"0.1.0\": versão do firmware, acessível no código.
build_flags = 
    -O2
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=3
    -DPROJECT_VERSION=\"0.1.0\"

; Bibliotecas externas (antecipadas — só são baixadas quando #incluídas):
; - Adafruit SSD1306 + Adafruit GFX: para M1 (driver do OLED). Escolhemos
;   Adafruit em vez de U8g2 porque a API é mais simples e suficiente para
;   nossas 4 telas. Trade-off discutido em M1.
; - ArduinoJson: para M3+ (serialização de logs estruturados em JSON,
;   caso queiramos exportar para o PC). Opcional agora.
; - bblanchon/ArduinoJson @ ^6.21.5
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9

; Modo de resolução de dependências: deep+ força o PlatformIO a escanear
; todos os #include recursivamente. Necessário quando bibliotecas locais
; em lib/ dependem umas das outras (vai ser o caso em M3+).
lib_ldf_mode = deep+

; Checagem de código (PlatformIO Check):
; Roda cppcheck no código. Habilitar para a fase de relatório PET-TEC.
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem
check_skip_packages = yes